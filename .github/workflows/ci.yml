name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One pinned toolchain for every job: Xcode 27.1 and its macOS 27.0 SDK, on
# GitHub's Xcode 27 image (`xcode-27`, macOS 27, Apple silicon). Pinned rather
# than taken from the image default, which moves between image releases (that
# image also carries 27.0 and a 27.2 release candidate). It is the Xcode the
# dev host builds with, so CI and local builds agree.
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  package:
    name: Package tests
    # macOS 27 like everything else. The package itself declares .macOS(.v15)
    # and does build there, but nothing ships to 15 — testing on it measures a
    # configuration no user has. Nothing in CI runs on macOS 26 any more; the
    # 26.x test VM is where 26 behaviour gets checked.
    runs-on: xcode-27
    # Read-only like every job that runs repository code. The badge push
    # needs write, and has a job of its own below that builds nothing.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show toolchain
        run: swift --version

      # The protocol engine, the daemon core, and everything that crosses XPC.
      # No signing, no Xcode project, no FSKit — this half of the codebase is
      # deliberately free of platform I/O so it can be tested anywhere.
      - name: swift build
        run: swift build

      # Serial on purpose. Several tests bound real durations — `withDeadline`
      # asserts that a 100 ms deadline has fired 2 s later, and the flush-policy
      # tests wait on a periodic timer. Those margins are generous on a
      # developer's machine and not on a 3-core runner: at 233 tests in parallel
      # CI was green, and at 316 both DeadlineTests failed deterministically on
      # two consecutive runs while passing locally every time. Saturating the
      # cores does not make a timeout wrong, it makes every continuation late,
      # so the suite was measuring the runner rather than the code.
      #
      # Costs ~17 s against ~8 s. Cheaper than a red CI nobody trusts.
      #
      # Coverage is instrumented on every run, PRs included, so that the badge
      # branch is never produced by a build configuration nobody else exercises.
      # The log is kept because swift-testing's per-bundle "Test run with N
      # tests" lines are where the test count on the badge comes from.
      - name: swift test
        run: |
          set -o pipefail
          swift test --no-parallel --enable-code-coverage 2>&1 | tee "$RUNNER_TEMP/swift-test.log"

      # Computed on every run, including pull requests, and printed. Only the
      # push below is main-only. Coverage that is calculated only where it is
      # published is coverage nobody sees while deciding whether to merge —
      # and the number moved 88.5% -> 86.6% the day the FSKit extension's data
      # path became measurable, which is exactly the kind of change worth
      # seeing on the pull request that causes it.
      - name: Coverage
        run: |
          set -euo pipefail
          scripts/coverage-badges.sh "$RUNNER_TEMP/swift-test.log" "$RUNNER_TEMP/badges"

      - name: Keep the badges for the publishing job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: badges
          path: ${{ runner.temp }}/badges
          if-no-files-found: error
          retention-days: 1

  # Derived data, not history: one orphan commit holding two shields.io
  # endpoint documents, force-pushed over whatever was there. Main only — a
  # pull request must not be able to move the numbers the README shows.
  #
  # Its own job because it is the only thing in CI that needs a write token,
  # and the test job runs the whole suite and every dependency it builds: a
  # job-wide write token there was a repository write for any code the tests
  # execute. This job checks nothing out and runs nothing but git.
  #
  # The badge is only refreshed when the suite is green, since this job needs
  # the package job to pass. A red run therefore leaves a stale count standing
  # next to a red build badge, which is the honest pairing.
  badges:
    name: Publish the tests and coverage badges
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: badges
          path: ${{ runner.temp }}/badges

      - name: Push them to the badges branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Badges for $SHA" -m "Published by .github/workflows/ci.yml."
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            badges:refs/heads/badges
          echo "pushed $(git ls-files | tr '\n' ' ')to refs/heads/badges"

  hygiene:
    name: Project hygiene
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install XcodeGen
        run: scripts/install-build-tools.sh "$RUNNER_TEMP/tools" xcodegen

      # The highest-value check in this repo.
      #
      # The .pbxproj once carried a hand-patched "Embed ExtensionKit Extensions"
      # phase that apps/project.yml did not declare, so a plain `xcodegen
      # generate` silently produced an app with **no filesystem module** and no
      # build error — a DMG that could not possibly work, from a build that
      # looked clean. This makes that impossible to reintroduce.
      - name: The generated project matches project.yml
        run: |
          # SWIFT_DETERMINISTIC_HASHING=1: without it, xcodegen's ordering of
          # same-named build phases (two "Embed Dependencies" copy-files
          # phases, one per embed destination) comes from Swift Dictionary
          # iteration order, which is randomized per process — making this
          # drift check a coin flip between two equally valid orderings of an
          # unchanged project.yml. Confirmed by running xcodegen generate six
          # times in a row without it and getting a spurious diff on half.
          cd apps && SWIFT_DETERMINISTIC_HASHING=1 xcodegen generate
          cd ..
          if ! git diff --quiet -- apps/iSCSIInitiator.xcodeproj/project.pbxproj; then
            echo "::error::apps/project.yml and the committed .pbxproj have diverged."
            echo "Run 'cd apps && SWIFT_DETERMINISTIC_HASHING=1 xcodegen generate' and commit the result."
            git --no-pager diff -- apps/iSCSIInitiator.xcodeproj/project.pbxproj
            exit 1
          fi
          echo "no drift"

      - name: Every plist parses
        run: |
          find . -name '*.plist' \
            -not -path './.git/*' -not -path '*/build/*' -not -path '*.xcodeproj/*' \
            -print0 | xargs -0 plutil -lint

      # There were two LaunchDaemon plists once, in different directories,
      # disagreeing about Program vs ProgramArguments and about log paths, with
      # nothing to say which was real. SMAppService resolves a daemon by its
      # plist *filename*, so a second copy is not redundancy — it is an
      # ambiguity that only shows up as "approved but nothing happens".
      - name: Exactly one LaunchDaemon plist
        run: |
          count=$(find . -name 'me.herko.iSCSIInitiator.daemon.plist' \
            -not -path './.git/*' -not -path '*/build/*' | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one daemon plist, found $count"
            find . -name 'me.herko.iSCSIInitiator.daemon.plist' -not -path './.git/*'
            exit 1
          fi
          echo "one daemon plist, as expected"

      # The Label must equal the filename minus .plist, or SMAppService
      # registers a service that can never be looked up again — including by
      # unregister(), leaving the user a root daemon they cannot remove. It is
      # silent at build time and at register() time. release.sh asserts this on
      # the built bundle; this catches it in the source.
      - name: The daemon's Label matches its filename
        run: |
          plist=apps/iSCSIApp/LaunchDaemons/me.herko.iSCSIInitiator.daemon.plist
          label=$(plutil -extract Label raw "$plist")
          expected=$(basename "$plist" .plist)
          if [ "$label" != "$expected" ]; then
            echo "::error::Label '$label' does not match filename '$expected.plist'"
            exit 1
          fi
          grep -q '<key>BundleProgram</key>' "$plist" || {
            echo "::error::the daemon plist must use BundleProgram, not an absolute Program path"
            exit 1
          }
          echo "Label and BundleProgram are correct"

  app:
    name: App build
    # Built against the macOS 27 SDK with a 26.0 deployment target, so the app
    # still installs on 26: anything newer than 26 must be availability-gated,
    # and against the 27 SDK the compiler is what enforces that. The step
    # below fails the job outright if the image ever hands it another SDK,
    # rather than letting that surface deep in the extension.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Toolchain
        run: |
          xcodebuild -version
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK $sdk from $DEVELOPER_DIR"
          case "$sdk" in
            27|27.*) ;;
            *) echo "::error::expected a macOS 27 SDK, got ${sdk:-none}"; exit 1 ;;
          esac

      - name: Install XcodeGen
        run: scripts/install-build-tools.sh "$RUNNER_TEMP/tools" xcodegen

      # No signing: this is a compile check. scripts/release.sh is what asserts
      # the things that matter about a shipping artifact.
      - name: Build
        run: |
          cd apps
          xcodegen generate
          xcodebuild -project iSCSIInitiator.xcodeproj \
            -scheme 'iSCSI Initiator' -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build
