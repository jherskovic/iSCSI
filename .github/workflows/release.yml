name: Release

# Push a tag, get a notarized DMG on the Releases page and an appcast entry
# pointing at it.
#
#     git tag v0.3.3 && git push origin v0.3.3
#
# Or run it by hand from the Actions tab. A manual run defaults to a dry run:
# it builds, signs and notarizes, but publishes nothing and does not touch the
# feed. Use that to prove the credentials work before trusting a tag with them,
# because the expensive failure here is silent — an export that cannot resolve
# the FSKit provisioning profile produces an app with no filesystem module.
#
# This job deliberately holds no logic of its own. scripts/release.sh carries
# every assertion about what a shippable artifact looks like, and it is the same
# script that runs on the author's Mac. A second, CI-only implementation would
# drift from it, and the drift would be discovered by users.
#
# Required repository secrets — docs/releasing.md has the recipe for each:
#   DEVELOPER_ID_CERT_P12       base64 of the .p12 (identity + private key)
#   DEVELOPER_ID_CERT_PASSWORD  its export password
#   APPLE_DEV_CERT_P12          base64 of an Apple Development .p12 (identity +
#                                private key). xcodebuild archive always wants
#                                a Development-category identity — Developer ID
#                                only gets used later, at export — and without
#                                this imported already, an ephemeral runner
#                                mints a fresh one every run against Apple's
#                                tiny per-account quota for that certificate
#                                type. Four releases in a row failed that way
#                                before this secret existed.
#   APPLE_DEV_CERT_PASSWORD     its export password
#   ASC_KEY_P8                  base64 of the App Store Connect .p8
#   ASC_KEY_ID                  the key's ID
#   ASC_ISSUER_ID               the issuer UUID
#   SPARKLE_ED_PRIVATE_KEY      Sparkle's EdDSA private key (generate_keys -x)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the release and update the appcast (otherwise dry run)'
        type: boolean
        default: false

permissions:
  contents: write

# Never two releases at once. They would race on the appcast commit, and the
# loser would silently drop the winner's entry.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize, publish
    runs-on: macos-26
    # Two notary round trips, each usually a few minutes and occasionally much
    # longer when Apple is busy.
    timeout-minutes: 90

    steps:
      # Full history: the appcast commit at the end pushes to main from what is
      # otherwise a shallow, detached checkout of a tag, and a shallow push is
      # a class of failure worth not having at the very last step of a release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # First, and all eight at once.
      #
      # Each credential used to be checked by the step that needed it, so a
      # repository with nothing configured failed on the certificate and said
      # "DEVELOPER_ID_CERT_P12 is not set" — which reads as one missing
      # certificate rather than as a release pipeline that was never given any
      # credentials, and costs a round trip per secret to discover otherwise.
      # Name everything that is missing, before spending a minute on Homebrew.
      - name: Every credential this needs is present
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEV_CERT_P12: ${{ secrets.APPLE_DEV_CERT_P12 }}
          APPLE_DEV_CERT_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # No bash arrays: the runner's /bin/bash is 3.2, where expanding an
          # empty array under `set -u` is itself an error — which would report
          # a shell bug instead of the missing secrets.
          set -uo pipefail
          missing=""
          count=0
          for name in DEVELOPER_ID_CERT_P12 DEVELOPER_ID_CERT_PASSWORD \
                      APPLE_DEV_CERT_P12 APPLE_DEV_CERT_PASSWORD \
                      ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID SPARKLE_ED_PRIVATE_KEY; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
              count=$((count + 1))
            else
              echo "  ok  $name"
            fi
          done
          if [ "$count" -gt 0 ]; then
            echo "::error::$count of 8 repository secrets are not set:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "docs/releasing.md has the command that produces each one."
            exit 1
          fi
          echo "all eight present"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          # If a future image bumps Xcode to something whose SDK breaks the
          # build, pin it here with DEVELOPER_DIR rather than discovering it in
          # a release. The app job in ci.yml builds on this same image, so a
          # break shows up there first.
          ls -d /Applications/Xcode*.app 2>/dev/null || true

      - name: Install build tools
        run: brew install xcodegen create-dmg

      # Both of these are also enforced later — the tag by the DMG filename it
      # produces, the build number by update-appcast.py. But "later" is after an
      # archive and two notarizations, so a forgotten number costs half an hour
      # to discover. Here it costs thirty seconds.
      - name: The version and build number are releasable
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          WILL_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          version=$(awk '/MARKETING_VERSION:/ {gsub(/"/,"",$2); print $2; exit}' apps/project.yml)
          build=$(awk '/CURRENT_PROJECT_VERSION:/ {gsub(/"/,"",$2); print $2; exit}' apps/project.yml)

          # The tag is the claim; project.yml is the fact. If they disagree, the
          # DMG filename, the appcast entry and the tag all name different
          # things, and it surfaces much later as an update that never arrives.
          if [ "$IS_TAG" = "true" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match MARKETING_VERSION $version in apps/project.yml"
            exit 1
          fi

          # Sparkle orders releases by build number and ignores the marketing
          # version entirely, so shipping a new version on a stale build number
          # replaces the previous entry in the feed instead of adding to it.
          #
          # Asked of update-appcast.py rather than reimplemented here. The first
          # version of this step restated the rule and got it wrong in a way that
          # only showed up in the situation everyone hits first: it refused any
          # build already in the feed, so the very release you just shipped could
          # not be dry-run, which is the run you make while setting up
          # credentials.
          #
          # And only when this run will actually write the feed. A dry run
          # publishes nothing, so what the feed already contains cannot be a
          # reason to stop it.
          if [ "$WILL_PUBLISH" = "true" ]; then
            scripts/update-appcast.py --check-only --version "$version" --build "$build"
          else
            echo "  dry run: not checking the build number against the feed"
          fi
          echo "version $version, build $build"

      # A dedicated keychain, thrown away with the runner. Importing into the
      # login keychain would work too, but this makes the blast radius obvious
      # and lets the cleanup step be unconditional.
      - name: Import the Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          # Same team release.sh asserts on every Mach-O it signs.
          TEAM_ID: "4A27X5PJP3"
        run: |
          set -euo pipefail
          [ -n "$CERT_P12" ] || { echo "::error::DEVELOPER_ID_CERT_P12 is not set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          # Needed again by the Apple Development import step, to re-run
          # set-key-partition-list after its identity lands in the same
          # keychain. A step's local variables do not survive to the next
          # step; GITHUB_ENV is what does. The keychain itself is thrown away
          # with the runner at the end of the job either way.
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # -lut without -l: no auto-lock timeout partway through a 40-minute
          # notarization wait, which would fail the DMG signing at the end.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Not folded into the redirect below: under `set -e` a failing decode
          # aborts the step with no output at all, which is the least helpful
          # possible response to a malformed secret.
          if ! printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12" 2>/dev/null; then
            echo "::error::DEVELOPER_ID_CERT_P12 is not valid base64."
            echo "Re-set it with:  base64 < DeveloperID.p12 | gh secret set DEVELOPER_ID_CERT_P12"
            exit 1
          fi

          # `security import` answers all three of its failure modes with the
          # same sentence — "MAC verification failed during PKCS12 import (wrong
          # password?)". Measured: a wrong password, a password carrying a
          # trailing newline from transport, and a .p12 written by OpenSSL 3
          # rather than Keychain Access are indistinguishable in that output, and
          # only one of them is about the password. Separate them here.

          # The MAC algorithm sits in the PKCS#12 MacData and reads without a
          # password. Keychain Access writes SHA-1; OpenSSL 3 defaults to
          # SHA-256, which macOS's importer cannot verify at all — so it reports
          # a password problem for a file that no password would open.
          #
          # Finding no MAC at all is the "this is not a .p12" case, and it is
          # this probe rather than anything cheaper that catches it: macOS
          # `base64 --decode` accepts arbitrary garbage with exit 0, and
          # `openssl asn1parse` will parse the six bytes that fall out of it
          # without complaint. Both measured.
          # `|| true` is load-bearing. asn1parse exits non-zero on a file that is
          # not DER, and under `set -e` + `pipefail` that aborts the step at the
          # assignment — printing nothing, which is the one outcome this whole
          # block exists to prevent. The empty result IS the signal; let it
          # reach the test below.
          macalg=$(/usr/bin/openssl asn1parse -inform der -in "$RUNNER_TEMP/cert.p12" 2>/dev/null \
                   | awk '/OBJECT/ && /:sha/ {print $NF}' | tail -1 || true)
          if [ -z "$macalg" ]; then
            echo "::error::DEVELOPER_ID_CERT_P12 did not decode to a PKCS#12 file"
            echo "($(wc -c < "$RUNNER_TEMP/cert.p12" | tr -d ' ') bytes, no MAC found)."
            echo "Re-set it with:  base64 < DeveloperID.p12 | gh secret set DEVELOPER_ID_CERT_P12"
            exit 1
          fi
          if [ "$macalg" != ":sha1" ] && [ "$macalg" != "sha1" ]; then
            echo "::error::this .p12 uses a $macalg MAC. macOS can only import SHA-1 PKCS#12."
            echo "It was almost certainly written by OpenSSL 3 rather than exported from"
            echo "Keychain Access. Either re-export from Keychain Access, or convert it:"
            echo "  openssl pkcs12 -legacy -export -in modern.p12 -out legacy.p12 ..."
            exit 1
          fi

          import_p12() {
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$1" \
              -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign \
              >/dev/null 2>&1
          }

          if import_p12 "$CERT_PASSWORD"; then
            echo "  certificate imported"
          else
            # A release should not die over whitespace a secret picked up in
            # transit, but it should say that is what happened — otherwise the
            # secret stays wrong and the next person debugs it again.
            TRIMMED=$(printf '%s' "$CERT_PASSWORD" | tr -d '\r\n')
            if [ "$TRIMMED" != "$CERT_PASSWORD" ] && import_p12 "$TRIMMED"; then
              echo "::warning::DEVELOPER_ID_CERT_PASSWORD has a trailing newline. It worked"
              echo "once trimmed, but re-set it to be rid of this: gh secret set DEVELOPER_ID_CERT_PASSWORD"
            else
              echo "::error::the .p12 is well-formed and SHA-1 MACed, so DEVELOPER_ID_CERT_PASSWORD"
              echo "does not match the password the .p12 was exported with. This is the export"
              echo "password you chose in Keychain Access, not your login password and not the"
              echo "certificate's name."
              exit 1
            fi
          fi
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign gets a UI prompt nobody can answer and the
          # build hangs until the job times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # Put it in the search list so `security find-identity` — which
          # release.sh uses in preflight — and codesign can both see it.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"

          security find-identity -v -p codesigning "$KEYCHAIN"

          # Importing the wrong .p12 succeeds. `security find-identity` then
          # exits 0 while reporting "0 valid identities found", and the run gets
          # all the way to the archive before signing fails for a reason that
          # has nothing to do with the archive. Assert what we actually need.
          if ! security find-identity -v -p codesigning "$KEYCHAIN" \
               | grep -q "Developer ID Application: .*($TEAM_ID)"; then
            echo "::error::the .p12 imported, but holds no 'Developer ID Application'"
            echo "identity for team $TEAM_ID. Check which certificate was exported —"
            echo "an Apple Development certificate cannot sign a Developer ID release."
            exit 1
          fi

      # Same throwaway keychain as above — this step runs after it on purpose,
      # since that step is what creates $KEYCHAIN (and $KEYCHAIN_PASSWORD).
      #
      # This is the actual fix for four releases failing in a row with "Your
      # account has reached the maximum number of certificates": xcodebuild
      # archive always wants a Development-category identity regardless of
      # CODE_SIGN_STYLE — Developer ID only gets used later, at -exportArchive,
      # which is an Xcode constraint rather than a choice made here. (Manual
      # signing style and pinning CODE_SIGN_IDENTITY to Developer ID
      # Application under Automatic were both tried and rejected by Xcode
      # outright — see the CODE_SIGN_STYLE comment in apps/project.yml.) Every
      # past CI run left -allowProvisioningUpdates to mint a fresh Apple
      # Development certificate for the archive, and an ephemeral runner can
      # never reuse one across runs, so each run burned one of Apple's tiny
      # per-account slots for that certificate type until none were left.
      # Importing one persisted identity here means the archive step only ever
      # needs to refresh its provisioning *profile* via the ASC key — which an
      # API key CAN do for an ordinary Development profile, unlike a Developer
      # ID one — and profile refreshes are not quota-limited.
      - name: Import the Apple Development certificate
        env:
          CERT_P12: ${{ secrets.APPLE_DEV_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
          TEAM_ID: "4A27X5PJP3"
        run: |
          set -euo pipefail
          [ -n "$CERT_P12" ] || { echo "::error::APPLE_DEV_CERT_P12 is not set"; exit 1; }
          [ -n "${KEYCHAIN:-}" ] || { echo "::error::\$KEYCHAIN is unset — did the Developer ID import step run first?"; exit 1; }

          if ! printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/appledev.p12" 2>/dev/null; then
            echo "::error::APPLE_DEV_CERT_P12 is not valid base64."
            echo "Re-set it with:  base64 < AppleDevelopment.p12 | gh secret set APPLE_DEV_CERT_P12"
            exit 1
          fi

          # Same three indistinguishable failure modes as the Developer ID
          # import above, and the same reasoning for checking them explicitly
          # rather than trusting security import's one error message for all
          # three.
          macalg=$(/usr/bin/openssl asn1parse -inform der -in "$RUNNER_TEMP/appledev.p12" 2>/dev/null \
                   | awk '/OBJECT/ && /:sha/ {print $NF}' | tail -1 || true)
          if [ -z "$macalg" ]; then
            echo "::error::APPLE_DEV_CERT_P12 did not decode to a PKCS#12 file"
            echo "($(wc -c < "$RUNNER_TEMP/appledev.p12" | tr -d ' ') bytes, no MAC found)."
            echo "Re-set it with:  base64 < AppleDevelopment.p12 | gh secret set APPLE_DEV_CERT_P12"
            exit 1
          fi
          if [ "$macalg" != ":sha1" ] && [ "$macalg" != "sha1" ]; then
            echo "::error::this .p12 uses a $macalg MAC. macOS can only import SHA-1 PKCS#12."
            echo "It was almost certainly written by OpenSSL 3 rather than exported from"
            echo "Keychain Access. Either re-export from Keychain Access, or convert it:"
            echo "  openssl pkcs12 -legacy -export -in modern.p12 -out legacy.p12 ..."
            exit 1
          fi

          import_p12() {
            security import "$RUNNER_TEMP/appledev.p12" -k "$KEYCHAIN" -P "$1" \
              -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign \
              >/dev/null 2>&1
          }

          if import_p12 "$CERT_PASSWORD"; then
            echo "  certificate imported"
          else
            TRIMMED=$(printf '%s' "$CERT_PASSWORD" | tr -d '\r\n')
            if [ "$TRIMMED" != "$CERT_PASSWORD" ] && import_p12 "$TRIMMED"; then
              echo "::warning::APPLE_DEV_CERT_PASSWORD has a trailing newline. It worked"
              echo "once trimmed, but re-set it to be rid of this: gh secret set APPLE_DEV_CERT_PASSWORD"
            else
              echo "::error::the .p12 is well-formed and SHA-1 MACed, so APPLE_DEV_CERT_PASSWORD"
              echo "does not match the password the .p12 was exported with. This is the export"
              echo "password chosen in Keychain Access, not a login password and not the"
              echo "certificate's name."
              exit 1
            fi
          fi
          rm -f "$RUNNER_TEMP/appledev.p12"

          # Re-run rather than reuse the first call's effect: the partition
          # list applies to whichever private keys are in the keychain at the
          # moment it runs, and this identity's key was not there yet then.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          security find-identity -v -p codesigning "$KEYCHAIN"

          if ! security find-identity -v -p codesigning "$KEYCHAIN" \
               | grep -q "Apple Development:"; then
            echo "::error::the .p12 imported, but holds no 'Apple Development' identity"
            echo "at all. A Developer ID Application certificate cannot stand in for this"
            echo "one — xcodebuild archive always wants a Development-category identity,"
            echo "regardless of CODE_SIGN_STYLE."
            exit 1
          fi

          # Not the CN: on an Apple ID that belongs to more than one team, an
          # "Apple Development" certificate's human-readable name can carry an
          # unrelated team's ID (observed: an individual team's ID in the CN
          # on a cert issued for, and fully usable under, this organization
          # team). OU is the field codesign and Xcode's provisioning matching
          # actually key off, so that is what has to match $TEAM_ID.
          DEV_SUBJECT=$(security find-certificate -c "Apple Development" -p "$KEYCHAIN" 2>/dev/null \
                        | openssl x509 -noout -subject 2>/dev/null || true)
          if ! printf '%s' "$DEV_SUBJECT" | grep -qE "OU[[:space:]]*=[[:space:]]*${TEAM_ID}(,|$)"; then
            echo "::error::the .p12 imported an 'Apple Development' identity, but its OU"
            echo "does not match team $TEAM_ID ($DEV_SUBJECT). OU is the field codesign"
            echo "and Xcode's provisioning matching actually use — the CN's parenthetical"
            echo "team name is cosmetic and can be wrong on a multi-team Apple ID."
            exit 1
          fi

      # An App Store Connect API key cannot create a Developer ID provisioning
      # profile — the portal refuses that type for API keys outright, with
      # "Team ... does not have permission". So the profiles ship in the repo and
      # the export resolves from them with profile creation forbidden.
      #
      # They are not secrets. A .provisionprofile is a CMS-signed plist of
      # entitlements plus the *public* signing certificates, and these exact
      # bytes already ship inside every DMG on the Releases page as
      # Contents/embedded.provisionprofile. Verified byte-identical.
      #
      # They expire in 2044, so there is no scheduled rotation. The one thing
      # that invalidates them is an entitlement change: Xcode re-mints on the
      # next local build, and the new embedded.provisionprofile must be copied
      # back over these.
      - name: Install the Developer ID provisioning profiles
        run: |
          set -euo pipefail
          dest="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$dest"
          count=0
          for f in packaging/profiles/*.provisionprofile; do
            [ -e "$f" ] || continue
            # Xcode resolves profiles by UUID, and expects the filename to match.
            uuid=$(security cms -D -i "$f" | plutil -extract UUID raw -)
            name=$(security cms -D -i "$f" | plutil -extract Name raw -)
            cp "$f" "$dest/$uuid.provisionprofile"
            echo "  $name"
            count=$((count + 1))
          done
          if [ "$count" -lt 2 ]; then
            echo "::error::expected the app and fsext profiles in packaging/profiles/, found $count."
            echo "Without them the export cannot resolve com.apple.developer.fskit.fsmodule"
            echo "and would produce an app whose filesystem module macOS refuses to load."
            exit 1
          fi

      - name: Write the API and Sparkle keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$ASC_KEY_P8" ] || { echo "::error::ASC_KEY_P8 is not set"; exit 1; }
          [ -n "$SPARKLE_ED_PRIVATE_KEY" ] || { echo "::error::SPARKLE_ED_PRIVATE_KEY is not set"; exit 1; }

          umask 077
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_key"

          # A .p8 that did not survive base64 round-tripping fails much later,
          # inside notarytool, as an authentication error that reads like a
          # revoked key.
          head -1 "$RUNNER_TEMP/asc.p8" | grep -q 'BEGIN PRIVATE KEY' \
            || { echo "::error::ASC_KEY_P8 did not decode to a PEM private key"; exit 1; }

      # The one step that does anything. Everything above is environment.
      - name: Build, notarize, publish
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_ED_KEY_FILE: ${{ runner.temp }}/sparkle_ed_key
          GH_TOKEN: ${{ github.token }}
          # Through the environment rather than interpolated into the script, so
          # nothing from the event can ever be read as shell.
          EVENT_NAME: ${{ github.event_name }}
          WANT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] || [ "$WANT_PUBLISH" = "true" ]; then
            scripts/release.sh --publish
          else
            echo "dry run: building and notarizing, publishing nothing"
            scripts/release.sh
          fi

      # Separate from the build so a failure here is unambiguous: the release is
      # already published and verified at this point, and only the feed is
      # missing. Re-running just this part by hand is safe.
      - name: Commit the appcast to main
        if: github.event_name == 'push' || inputs.publish
        run: |
          set -euo pipefail
          . build/release-metadata.env

          # This runs from a detached checkout of the tag, with appcast.xml (and
          # possibly Package.resolved) modified by the build. -f discards all of
          # that: build/ is gitignored, so the metadata sourced above survives.
          #
          # The feed is re-applied to main rather than committed from the tag's
          # tree, because SUFeedURL points at main and main may have moved since
          # the tag was cut. Copying the tag's appcast over would silently revert
          # anything that landed in between.
          git fetch origin main
          git checkout -f -B publish-appcast origin/main

          scripts/update-appcast.py \
            --version "$VERSION" --build "$BUILD_NUMBER" \
            --signature "$ED_SIGNATURE" --length "$ED_LENGTH" \
            --url "$ASSET_URL" --min-system "$MIN_SYSTEM"

          if git diff --quiet -- appcast.xml; then
            echo "appcast already carries this release; nothing to commit"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add appcast.xml
            git commit -m "Release $VERSION" -m "$ASSET_URL" \
              -m "Published by .github/workflows/release.yml."
            git push origin HEAD:main
          fi
          echo "APPCAST_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # The feed is the contract with every installed copy of the app: it
      # promises that a specific number of bytes, with a specific signature,
      # is at a specific URL. Check the promise against reality.
      #
      # Read at the commit SHA, not at .../main/appcast.xml. Both are served by
      # the same CDN, but a branch path has a cached entry to invalidate and a
      # commit path does not — so the branch URL can serve the previous release
      # for minutes after the push, and a check against it fails a release that
      # is in fact perfectly good. The branch URL catches up on its own; what
      # actually needs verifying is that the content committed is correct.
      - name: The feed promises a file that exists
        if: github.event_name == 'push' || inputs.publish
        run: |
          set -euo pipefail
          . build/release-metadata.env
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${APPCAST_SHA}/appcast.xml"
          echo "reading $raw"

          url=""
          for attempt in 1 2 3 4 5 6; do
            url=$(curl -fsSL "$raw" | scripts/appcast-newest-url.py -) && break
            echo "  not readable yet (attempt $attempt)"; sleep 10
          done

          if [ "$url" != "$ASSET_URL" ]; then
            echo "::error::the feed's newest enclosure is '${url:-nothing}', expected $ASSET_URL"
            exit 1
          fi
          served=$(curl -sIL "$url" | awk 'BEGIN{IGNORECASE=1} /^content-length:/ {gsub(/\r/,""); v=$2} END{print v}')
          if [ "$served" != "$ED_LENGTH" ]; then
            echo "::error::$url serves ${served:-nothing} bytes, the feed claims $ED_LENGTH"
            exit 1
          fi
          echo "ok: users will get $served bytes from $url"

      - name: Keep the DMG even when something later failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: build/*.dmg
          if-no-files-found: ignore
          retention-days: 14

      - name: Shred the credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/sparkle_ed_key" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "${KEYCHAIN:-$RUNNER_TEMP/release.keychain-db}" 2>/dev/null || true
