# XcodeGen project for the iSCSI Initiator app + extensions.
# Regenerate with:  cd apps && xcodegen generate
# Then open iSCSIInitiator.xcodeproj, set your signing team, and build.
#
# The protocol engine (iSCSIKit) lives in the parent SwiftPM package and is
# referenced as a local package so the app/extensions share the exact code
# that the 129-test suite and real-NAS verification exercise.

name: iSCSIInitiator
options:
  bundleIdPrefix: me.herko.iSCSIInitiator
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  iSCSI:
    path: ..

settings:
  base:
    # Fill in your Apple Developer team, or set it in Xcode's Signing pane.
    DEVELOPMENT_TEAM: "4A27X5PJP3"
    # Automatic signing is enough for the Developer ID release, verified: with
    # -allowProvisioningUpdates, Xcode registers both App IDs, enables the FSKit
    # Module capability and mints "Mac Team Direct Provisioning Profile" for the
    # app and the appex, and `-exportArchive method: developer-id` produces
    # Developer ID Application signatures with hardened runtime, a secure
    # timestamp and an embedded .provisionprofile carrying
    # com.apple.developer.fskit.fsmodule. No manual profile management, and no
    # entitlement request to Apple — see docs/entitlements.md.
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "3"

targets:
  # ---- Container app ----
  iSCSIApp:
    type: application
    platform: macOS
    sources:
      # initiator.icon is an Icon Composer bundle (macOS 26+). It must be a
      # single file reference in the Resources phase, not walked as a directory
      # of loose PNGs and JSON — actool consumes the bundle whole. Hence the
      # exclude plus the explicit `type: file` entry.
      - path: iSCSIApp
        excludes:
          - "initiator.icon/**"
          - "LaunchDaemons/**"
      - path: iSCSIApp/initiator.icon
        type: file
      # SMAppService.daemon(plistName:) looks here, and nowhere else.
      - path: iSCSIApp/LaunchDaemons/me.herko.iSCSIInitiator.daemon.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    # The shipping app embeds the FSKit extension (Backend A) and nothing else.
    #
    # The dext is deliberately NOT a dependency: its DriverKit entitlements are
    # approval-gated by Apple, so including it makes every Developer ID export
    # fail at profile resolution. It stays buildable via the iSCSIDext-dev
    # scheme below. See docs/entitlements.md.
    #
    # This embed used to be hand-patched directly into the .pbxproj (commit
    # cdab9da) while project.yml still said "built separately" — which meant a
    # plain `xcodegen generate` silently produced an app with no filesystem
    # module and no build error. Declare it here so regeneration is safe.
    dependencies:
      - target: iSCSIFSExtension
        embed: true
      # Contents/MacOS/iscsid. It used to be installed by hand to
      # /usr/local/libexec, which put the one root-privileged binary in the
      # product outside the signed bundle and outside notarization. Inside the
      # bundle it is covered by both, and SMAppService's BundleProgram can
      # address it relatively, so the app keeps working when it is moved.
      - target: iscsid
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: "iSCSI Initiator"
        PRODUCT_BUNDLE_IDENTIFIER: me.herko.iSCSIInitiator
        INFOPLIST_FILE: iSCSIApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iSCSIApp/iSCSIApp.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Names the Icon Composer bundle above, without its extension. actool
        # compiles it into Assets.car and stamps CFBundleIconName.
        ASSETCATALOG_COMPILER_APPICON_NAME: initiator

  # ---- The daemon ----
  # Built by Xcode rather than by `swift build` so that one archive produces
  # every binary the product ships, all signed with the same Developer ID and
  # all covered by a single notarization submission. The SwiftPM executable
  # target stays for `swift run iscsid` in the dev loop; this compiles the same
  # sources against the same package products.
  iscsid:
    type: tool
    platform: macOS
    sources:
      - ../Sources/iscsid
    dependencies:
      - package: iSCSI
        product: iSCSIKit
      - package: iSCSI
        product: iSCSIDaemonKit
    settings:
      base:
        PRODUCT_NAME: iscsid
        # Required for notarization, and required of anything a hardened app
        # launches. release.sh asserts it on every Mach-O in the bundle.
        ENABLE_HARDENED_RUNTIME: YES

  # ---- DriverKit extension (Backend B): virtual SCSI HBA ----
  # DriverKit isn't a first-class XcodeGen platform; express it as a macOS
  # target whose SDK/product-type are overridden to DriverKit.
  iSCSIDext:
    type: driver-extension            # com.apple.product-type.driver-extension
    platform: macOS
    sources:
      - iSCSIDext
      - path: Shared/iSCSIUserClientShared.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.herko.iSCSIInitiator.dext
        INFOPLIST_FILE: iSCSIDext/Info.plist
        CODE_SIGN_ENTITLEMENTS: iSCSIDext/iSCSIDext.entitlements
        SDKROOT: driverkit
        SUPPORTED_PLATFORMS: driverkit
        DRIVERKIT_DEPLOYMENT_TARGET: "24.0"
        # DriverKit dexts on Apple Silicon MUST be arm64e (the platform ABI the
        # kernel's dext launcher grades against). Because this target is declared
        # `platform: macOS` for XcodeGen's benefit, the macOS ARCHS_STANDARD
        # (arm64 x86_64) would otherwise leak in and build a *plain* arm64 slice
        # with no arm64e — the kernel then rejects the spawn with ENOEXEC
        # ("Exec format error") even though matching, signing, and entitlements
        # are all fine. Force arm64e to match every shipping Apple dext.
        ARCHS: arm64e
        ONLY_ACTIVE_ARCH: "NO"
        PRODUCT_NAME: me.herko.iSCSIInitiator.dext
        # iig compiles the .iig files; DriverKit + SCSIControllerDriverKit link.
        OTHER_LDFLAGS: "-framework DriverKit -framework SCSIControllerDriverKit"

  # ---- FSKit extension (Backend A): iSCSI-backed block-device file ----
  # extensionkit-extension, not app-extension: FSKit modules are ExtensionKit
  # extensions (EXAppExtensionAttributes / EXExtensionPointIdentifier in
  # iSCSIFSExtension/Info.plist), and they must land in Contents/Extensions/,
  # which is what the "Embed ExtensionKit Extensions" phase does. Declaring it
  # as app-extension puts it in Contents/PlugIns/ where fskit never finds it.
  iSCSIFSExtension:
    type: extensionkit-extension
    platform: macOS
    sources:
      - iSCSIFSExtension
    dependencies:
      - package: iSCSI
        product: iSCSIKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.herko.iSCSIInitiator.fsext
        INFOPLIST_FILE: iSCSIFSExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: iSCSIFSExtension/iSCSIFSExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES

# Two schemes, because the two backends have incompatible signing needs.
#
# "iSCSI Initiator" is what ships and what scripts/release.sh archives: app +
# embedded FSKit extension, both signable with a plain Developer ID profile.
#
# "iSCSIDext-dev" builds the DriverKit extension on its own for the SIP-off VM.
# It can never be part of a Developer ID export until Apple grants the DriverKit
# family entitlements, so keeping it in its own scheme is what stops an
# accidental `xcodebuild -scheme iSCSIApp` from dragging it into a release.
schemes:
  iSCSI Initiator:
    build:
      targets:
        iSCSIApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  iSCSIDext-dev:
    build:
      targets:
        iSCSIDext: all
    run:
      config: Debug
    archive:
      config: Debug
